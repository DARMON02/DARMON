<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>BBQ Burger Admin</title><style>:root{--o:#ff6a00;--d:#171717;--bg:#f5f5f5}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#222}.wrap{max-width:480px;margin:auto;padding:14px 14px 90px}.top{background:var(--d);color:#fff;border-radius:22px;padding:18px}.top h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#bbb}.notice{margin:12px 0;padding:12px;border-radius:14px;background:#fff3cd}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.card,.item{background:#fff;border-radius:18px;padding:14px;box-shadow:0 3px 14px #0000000d}.num{font-weight:800;font-size:24px}.muted{font-size:12px;color:#777}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}button{border:0;border-radius:12px;padding:10px 13px;font-weight:700}.tabs button{background:#fff;white-space:nowrap}.tabs button.active,.primary{background:var(--o);color:#fff}.item{display:flex;justify-content:space-between;gap:8px;margin:8px 0}.actions{display:flex;gap:5px;align-items:flex-start}.actions button{padding:8px;background:#eee}input,textarea,select{width:100%;border:1px solid #ddd;border-radius:12px;background:#fff;padding:11px;margin:5px 0 10px}label{font-size:12px;font-weight:700}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.sheet{background:#f7f7f7;width:100%;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hide{display:none}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}</style></head><body><div class="wrap"><div class="top"><h1>🔥 BBQ Burger Admin</h1><div class="sub" id="who">Telegram tekshirilmoqda...</div></div><div class="notice" id="status">Yuklanmoqda...</div><div class="stats" id="stats"></div><div class="tabs"><button class="active" data-tab="products">Mahsulotlar</button><button data-tab="categories">Kategoriyalar</button><button data-tab="banners">Bannerlar</button><button data-tab="settings">Sozlamalar</button></div><div id="content"></div></div><div class="modal" id="modal"><div class="sheet"><div id="form"></div></div></div><script>const API='https://tgcmevhuxwzcmeseysax.supabase.co/functions/v1/bbq-admin-api';const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const initData=tg?.initData||'';let D={categories:[],products:[],banners:[],settings:[]};let tab='products';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,initData,...extra})});return r.json()}async function start(){if(!initData){$('#status').textContent='Bu panel faqat Telegram bot ichidan ochiladi.';return}const b=await call('bootstrap');if(!b.ok){$('#status').textContent='Kirish rad etildi: '+b.error;return}$('#who').textContent=(b.user.first_name||'Admin')+' · '+b.roles.join(', ');const s={Kategoriyalar:b.counts.categories,Mahsulotlar:b.counts.products,Faol:b.counts.active,Tugagan:b.counts.outOfStock};$('#stats').innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><div class="num">${v}</div><div class="muted">${k}</div></div>`).join('');$('#status').classList.add('hide');await load()}async function load(){const r=await call('list');if(!r.ok){alert(r.error);return}D=r;render()}function render(){const c=$('#content');if(tab==='products')c.innerHTML=`<div class="toolbar"><b>Mahsulotlar</b><button class="primary" onclick="edit('product')">+ Qo‘shish</button></div>`+D.products.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><br><span class="muted">${Number(x.price_uzs).toLocaleString()} so‘m · ${esc(x.menu_categories?.name||'')} · ${x.is_in_stock?'Mavjud':'Tugagan'}</span></div><div class="actions"><button onclick="edit('product','${x.id}')">✏️</button><button onclick="delx('product','${x.id}')">🗑</button></div></div>`).join('');if(tab==='categories')c.innerHTML=`<div class="toolbar"><b>Kategoriyalar</b><button class="primary" onclick="edit('category')">+ Qo‘shish</button></div>`+D.categories.map(x=>`<div class="item"><div><b>${esc(x.emoji||'')} ${esc(x.name)}</b><br><span class="muted">Tartib: ${x.sort_order} · ${x.is_active?'Faol':'Yopiq'}</span></div><div class="actions"><button onclick="edit('category','${x.id}')">✏️</button><button onclick="delx('category','${x.id}')">🗑</button></div></div>`).join('');if(tab==='banners')c.innerHTML=`<div class="toolbar"><b>Bannerlar</b><button class="primary" onclick="edit('banner')">+ Qo‘shish</button></div>`+D.banners.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><br><span class="muted">${esc(x.subtitle||'')} · ${x.is_active?'Faol':'Yopiq'}</span></div><div class="actions"><button onclick="edit('banner','${x.id}')">✏️</button><button onclick="delx('banner','${x.id}')">🗑</button></div></div>`).join('');if(tab==='settings'){const m={};D.settings.forEach(x=>m[x.key]=x.value);c.innerHTML=`<div class="card"><label>Yetkazib berish narxi</label><input id="fee" type="number" value="${m.delivery_fee_uzs??12000}"><button class="primary" onclick="saveFee()">Saqlash</button></div><div class="card" style="margin-top:10px"><label>Do‘kon holati</label><select id="open"><option value="true" ${m.shop_open===true?'selected':''}>Ochiq</option><option value="false" ${m.shop_open===false?'selected':''}>Yopiq</option></select><button class="primary" onclick="saveOpen()">Saqlash</button></div>`}}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});function edit(entity,id){const arr=entity==='product'?D.products:entity==='category'?D.categories:D.banners;const x=id?arr.find(v=>v.id===id)||{}:{};let f='';if(entity==='category')f=`<h3>Kategoriya</h3><label>Nomi</label><input id="name" value="${esc(x.name||'')}"><label>Emoji</label><input id="emoji" value="${esc(x.emoji||'')}"><label>Slug</label><input id="slug" value="${esc(x.slug||'')}"><label>Tartib</label><input id="sort" type="number" value="${x.sort_order||0}"><label>Holati</label><select id="active"><option value="true" ${x.is_active!==false?'selected':''}>Faol</option><option value="false" ${x.is_active===false?'selected':''}>Yopiq</option></select>`;if(entity==='product')f=`<h3>Mahsulot</h3><label>Nomi</label><input id="name" value="${esc(x.name||'')}"><label>Tavsif</label><textarea id="desc">${esc(x.description||'')}</textarea><label>Narx</label><input id="price" type="number" value="${x.price_uzs||0}"><label>Kategoriya</label><select id="cat">${D.categories.map(c=>`<option value="${c.id}" ${x.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>Rasm URL</label><input id="image" value="${esc(x.image_url||'')}"><label>Badge</label><input id="badge" value="${esc(x.badge||'')}"><div class="row"><div><label>Tartib</label><input id="sort" type="number" value="${x.sort_order||0}"></div><div><label>Mavjud</label><select id="stock"><option value="true" ${x.is_in_stock!==false?'selected':''}>Ha</option><option value="false" ${x.is_in_stock===false?'selected':''}>Yo‘q</option></select></div></div><label>Holati</label><select id="active"><option value="true" ${x.is_active!==false?'selected':''}>Faol</option><option value="false" ${x.is_active===false?'selected':''}>Yopiq</option></select>`;if(entity==='banner')f=`<h3>Banner</h3><label>Sarlavha</label><input id="title" value="${esc(x.title||'')}"><label>Pastki matn</label><input id="subtitle" value="${esc(x.subtitle||'')}"><label>Rasm URL</label><input id="image" value="${esc(x.image_url||'')}"><label>Tugma matni</label><input id="action" value="${esc(x.action_text||'')}"><label>Tartib</label><input id="sort" type="number" value="${x.sort_order||0}"><label>Holati</label><select id="active"><option value="true" ${x.is_active!==false?'selected':''}>Faol</option><option value="false" ${x.is_active===false?'selected':''}>Yopiq</option></select>`;$('#form').innerHTML=f+`<div class="row"><button onclick="closeM()">Bekor</button><button class="primary" onclick="save('${entity}','${id||''}')">Saqlash</button></div>`;$('#modal').style.display='flex'}function closeM(){$('#modal').style.display='none'}async function save(entity,id){const row=id?{id}:{};if(entity==='category')Object.assign(row,{name:$('#name').value,emoji:$('#emoji').value||null,slug:$('#slug').value||$('#name').value.toLowerCase().replace(/\s+/g,'-'),sort_order:+$('#sort').value,is_active:$('#active').value==='true'});if(entity==='product')Object.assign(row,{name:$('#name').value,description:$('#desc').value,price_uzs:+$('#price').value,category_id:$('#cat').value,image_url:$('#image').value||null,badge:$('#badge').value||null,slug:id?(D.products.find(v=>v.id===id)?.slug||('p-'+Date.now())):($('#name').value.toLowerCase().replace(/[^a-z0-9]+/g,'-')||('p-'+Date.now())),sort_order:+$('#sort').value,is_in_stock:$('#stock').value==='true',is_active:$('#active').value==='true'});if(entity==='banner')Object.assign(row,{title:$('#title').value,subtitle:$('#subtitle').value,image_url:$('#image').value||null,action_text:$('#action').value,sort_order:+$('#sort').value,is_active:$('#active').value==='true'});const r=await call('save',{entity,row});if(r.ok){closeM();await load()}else alert(r.error)}async function delx(entity,id){if(!confirm('O‘chirilsinmi?'))return;const r=await call('delete',{entity,id});if(r.ok)await load();else alert(r.error)}async function saveFee(){const r=await call('setting',{key:'delivery_fee_uzs',value:+$('#fee').value});alert(r.ok?'Saqlandi':r.error);if(r.ok)await load()}async function saveOpen(){const r=await call('setting',{key:'shop_open',value:$('#open').value==='true'});alert(r.ok?'Saqlandi':r.error);if(r.ok)await load()}start();</script></body></html>
