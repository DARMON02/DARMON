<head>

<title>BBQ Burger</title>
<style>
:root{--orange:#ff6a00;--orange2:#ff8a1f;--dark:#121212;--dark2:#1d1d1f;--bg:#f6f1eb;--card:#fff;--muted:#767676;--green:#17823c;--red:#c62828;--line:#ece5de;--shadow:0 12px 32px #5c2b0b14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,#fffaf5 0,#f5f1ed 260px,#f3f3f3 100%);font-family:Arial,sans-serif;color:#171717}.app{max-width:520px;margin:auto;padding:10px 12px 112px}.head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px;padding:8px 2px}.brand{font-size:23px;font-weight:950;letter-spacing:-.7px}.brand b{color:var(--orange)}.hello,.muted{font-size:12px;color:var(--muted)}.statusbox{background:#fff3cd;padding:11px 12px;border-radius:14px;margin-bottom:10px}.pill{background:#eee;border-radius:999px;padding:5px 8px;font-size:11px;white-space:nowrap}
.hero{height:205px;background:radial-gradient(circle at 85% 20%,#ff7a0038,transparent 36%),linear-gradient(135deg,#0f0f0f,#292523);color:#fff;border-radius:26px;position:relative;overflow:hidden;margin-bottom:14px;box-shadow:0 18px 45px #1a0e0840}.heroInner{height:100%;padding:22px 18px;display:flex;align-items:center;position:relative;z-index:2}.heroText{width:58%;position:relative;z-index:3}.heroEyebrow{display:inline-flex;background:#ff6a0024;border:1px solid #ff8b4a55;color:#ffb785;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;margin-bottom:9px}.hero h2{margin:0 0 7px;font-size:25px;line-height:1.03;letter-spacing:-.7px}.hero p{margin:0;font-size:12px;color:#dedede;line-height:1.45}.heroMedia{position:absolute;right:-6px;top:8px;width:48%;height:188px;display:flex;align-items:center;justify-content:center}.heroMedia img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 18px #0008)}.heroEmoji{font-size:104px;filter:drop-shadow(0 16px 15px #0008);transform:rotate(-7deg)}.heroDots{position:absolute;left:18px;bottom:12px;display:flex;gap:5px;z-index:4}.heroDot{width:6px;height:6px;border-radius:99px;background:#ffffff55}.heroDot.active{width:21px;background:var(--orange)}
.search{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid #efe8e1;border-radius:17px;padding:12px 14px;margin-bottom:12px;box-shadow:0 7px 20px #5d32100b}.search input{border:0;outline:0;width:100%;font-size:14px;background:transparent}.cats{display:flex;gap:8px;overflow:auto;padding:1px 1px 7px;margin-bottom:8px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{border:1px solid #eee4dc;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap;box-shadow:0 4px 14px #5a2b0908}.cat.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.sectionTitle{display:flex;align-items:flex-end;justify-content:space-between;margin:10px 2px 10px}.sectionTitle b{font-size:18px}.sectionTitle span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.product{background:#fff;border-radius:21px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;border:1px solid #f2ebe5;transition:transform .16s ease,box-shadow .16s ease}.product:active{transform:scale(.985);box-shadow:0 6px 18px #5c2b0b14}.pic{height:158px;background:radial-gradient(circle at 50% 42%,#fff 0,#fff 42%,#f7eee6 100%);display:flex;align-items:center;justify-content:center;font-size:58px;position:relative;overflow:hidden;padding:9px}.pic img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;filter:drop-shadow(0 9px 10px #63341922)}.badge{position:absolute;top:9px;left:9px;background:linear-gradient(135deg,#ff4d00,#ff8a00);color:#fff;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:950;box-shadow:0 5px 15px #ff5d0044;max-width:calc(100% - 18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sold{position:absolute;inset:0;background:#0009;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;backdrop-filter:blur(2px)}.body{padding:10px 11px 12px;display:flex;flex:1;flex-direction:column}.name{font-weight:950;font-size:14px;line-height:1.2;letter-spacing:-.15px}.desc{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.35;min-height:28px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}.price{font-weight:950;font-size:14px;color:#171717}.add{border:0;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;width:36px;height:36px;border-radius:12px;font-size:21px;font-weight:900;box-shadow:0 7px 15px #ff6a0038}.qty{display:flex;align-items:center;gap:5px}.qty button{border:0;width:29px;height:29px;border-radius:9px;background:#f0ece8;font-weight:950}.qty b{min-width:15px;text-align:center;font-size:12px}
.cartbar{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),496px);background:linear-gradient(135deg,#151515,#292929);color:#fff;border-radius:18px;padding:11px 13px;display:none;align-items:center;justify-content:space-between;z-index:15;box-shadow:0 16px 36px #0005;border:1px solid #ffffff12}.cartbar button{border:0;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;border-radius:13px;padding:10px 14px;font-weight:900}.cartPulse{animation:cartPulse .35s ease}@keyframes cartPulse{50%{transform:translateX(-50%) scale(1.035)}}.fly{position:fixed;z-index:1000;pointer-events:none;width:42px;height:42px;border-radius:12px;object-fit:contain;background:#fff;box-shadow:0 8px 20px #0004;transition:all .55s cubic-bezier(.2,.7,.2,1)}
.sheetbg{display:none;position:fixed;inset:0;background:#0009;z-index:30;align-items:flex-end;backdrop-filter:blur(3px)}.sheet{background:#f8f5f2;width:100%;max-height:92vh;overflow:auto;border-radius:27px 27px 0 0;padding:16px}.grab{width:45px;height:5px;border-radius:9px;background:#ccc;margin:0 auto 12px}.detailMedia{height:285px;border-radius:22px;background:radial-gradient(circle,#fff 0,#fff 52%,#f1e5da 100%);display:flex;align-items:center;justify-content:center;padding:14px;position:relative;overflow:hidden}.detailMedia img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 15px 15px #6d341c25)}.detailEmoji{font-size:115px}.detailBadge{position:absolute;left:14px;top:14px;background:linear-gradient(135deg,#ff4d00,#ff8a00);color:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:950}.detailName{font-size:24px;font-weight:950;line-height:1.08;margin:14px 1px 6px}.detailDesc{font-size:13px;line-height:1.5;color:#666}.detailFoot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.detailPrice{font-size:21px;font-weight:950}.detailAdd{border:0;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;border-radius:14px;padding:13px 18px;font-weight:900}.cartitem{background:#fff;border-radius:15px;padding:12px;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.sumrow{display:flex;justify-content:space-between;padding:6px 2px;font-size:13px}.total{font-size:18px;font-weight:900}.primary,.secondary,.verify{border:0;border-radius:14px;padding:13px 15px;font-weight:900;width:100%;margin-top:9px}.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff}.secondary{background:#eae5e1}.verify{background:#e9f3ff;color:#145da0}label{display:block;font-size:12px;font-weight:800;margin:10px 0 4px}input,textarea,select{width:100%;border:1px solid #ddd5ce;border-radius:13px;padding:12px;font-size:14px;background:#fff}input[type=checkbox]{width:auto}.success{text-align:center;padding:25px 10px}.success .big{font-size:55px}.orders .order{background:#fff;border-radius:16px;padding:13px;margin-bottom:9px}.orderTop{display:flex;justify-content:space-between;gap:10px}.orderNum{font-weight:900}
.tabsBottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:72px;background:#fff;border-top:1px solid #eee5de;display:flex;z-index:20;box-shadow:0 -8px 25px #0000000a}.tabsBottom button{flex:1;border:0;background:#fff;font-size:11px;font-weight:800}.tabsBottom button.active{color:var(--orange)}.tabsBottom span{display:block;font-size:21px;margin-bottom:3px}.hide{display:none!important}.profileCard{background:#fff;border-radius:18px;padding:16px;margin-bottom:10px}.verifyRow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f7f7f7;border-radius:13px;padding:11px}.ok{color:var(--green);font-weight:800}.bad{color:var(--red);font-weight:800}.locstate{font-size:12px;color:var(--muted);margin-top:6px}.info{background:#eef6ff;padding:11px;border-radius:13px;font-size:12px;line-height:1.4;margin-top:10px}.addrCard{background:#fff;border:1px solid #ececec;border-radius:15px;padding:12px;margin-top:9px}.addrCard.default{border-color:#ffb36e;background:#fffaf5}.addrHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.addrTitle{font-weight:900}.addrText{font-size:13px;margin-top:5px;line-height:1.4}.addrActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.addrActions button{border:0;border-radius:10px;padding:8px 9px;font-weight:700;font-size:11px}.miniPrimary{background:#fff0e4;color:#c84f00}.miniDanger{background:#fde9e9;color:var(--red)}.miniDefault{background:#e8f6ec;color:var(--green)}.addressChoice{width:100%;text-align:left;border:2px solid #eee;background:#fff;border-radius:14px;padding:12px;margin:7px 0}.addressChoice.selected{border-color:var(--orange);background:#fff7f0}.choiceTop{display:flex;justify-content:space-between;gap:8px}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.sectionHead button{border:0;background:#fff0e4;color:#c84f00;border-radius:11px;padding:9px 11px;font-weight:800}.checkrow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:10px;margin-top:10px}.checkrow label{margin:0}
@media(max-width:365px){.pic{height:145px}.hero{height:194px}.hero h2{font-size:22px}.detailMedia{height:255px}}
</style>
</head>
<body>
<div class="app">
  <div class="head"><div><div class="brand">🔥 <b>BBQ</b> BURGER</div><div class="hello" id="hello">Yuklanmoqda...</div></div><div id="shopState"></div></div>
  <div class="statusbox" id="status">Telegram tekshirilmoqda...</div>
  <section id="menuView">
    <div class="hero" id="hero"><div class="heroInner"><div class="heroText"><div class="heroEyebrow">🔥 ISSIQ VA MAZALI</div><h2>BBQ Burger</h2><p>Ishtaha ochuvchi menyu bir necha bosishda.</p></div><div class="heroMedia"><div class="heroEmoji">🍔</div></div></div></div>
    <div class="search">🔎 <input id="search" placeholder="Burger, lavash, ichimlik qidirish"></div>
    <div class="cats" id="cats"></div>
    <div class="sectionTitle"><b>Bugun nima yeymiz?</b><span id="productCount"></span></div>
    <div class="grid" id="products"></div>
  </section>
  <section id="ordersView" class="hide"><h2>Buyurtmalarim</h2><div class="orders" id="orders"></div></section>
  <section id="profileView" class="hide"><h2>Profil</h2><div id="profileContent"></div></section>
</div>
<div class="cartbar" id="cartbar"><div><b id="cartCount">0 ta</b><br><span id="cartTotal">0 so‘m</span></div><button onclick="openCart()">Savatni ochish</button></div>
<div class="sheetbg" id="sheet"><div class="sheet"><div class="grab"></div><div id="sheetContent"></div></div></div>
<div class="tabsBottom"><button class="active" data-view="menu"><span>🍔</span>Menyu</button><button data-view="orders"><span>🧾</span>Buyurtmalar</button><button data-view="profile"><span>👤</span>Profil</button></div>
<script>
const API='https://tgcmevhuxwzcmeseysax.supabase.co/functions/v1/bbq-customer-api';
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const initData=tg?.initData||'';
let D={categories:[],products:[],banners:[],settings:{},user:null,profile:null},cart={},activeCat='all',checkoutAddressId=null,addressCoords=null,addressReturn='profile',heroIndex=0,heroTimer=null;
const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('ru-RU')+' so‘m',esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const statusNames={new:'🆕 Yangi',accepted:'✅ Qabul qilindi',preparing:'👨‍🍳 Tayyorlanmoqda',courier:'🛵 Kuryerda',delivered:'✅ Yetkazildi',cancelled:'❌ Bekor qilindi'};
async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,initData,...extra})});return r.json()}
async function start(){if(!initData){$('#status').textContent='Bu Mini App faqat Telegram bot ichidan ochiladi.';return}const r=await call('bootstrap');if(!r.ok){$('#status').textContent='Kirish xatosi: '+r.error;return}D=r;$('#status').classList.add('hide');syncHeader();renderHero();renderCats();loadCart();renderProfile()}
function syncHeader(){$('#hello').textContent='Salom, '+(D.profile?.name||D.user?.first_name||'mijoz')+'!';$('#shopState').innerHTML=D.settings.shop_open===false?'<span class="pill">Yopiq</span>':'<span class="pill" style="background:#e5f8eb;color:#16743b">Ochiq</span>'}
function renderHero(){const arr=D.banners?.length?D.banners:[{title:'Issiq burger. Tez yetkazib berish.',subtitle:'Sevimli taomingizni bir necha bosishda buyurtma qiling.',image_url:null}];heroIndex=Math.min(heroIndex,arr.length-1);const b=arr[heroIndex];const media=b.image_url?`<img src="${esc(b.image_url)}" onerror="this.parentElement.innerHTML='<div class=\'heroEmoji\'>🍔</div>'">`:'<div class="heroEmoji">🍔</div>';const dots=arr.length>1?`<div class="heroDots">${arr.map((_,i)=>`<span class="heroDot ${i===heroIndex?'active':''}"></span>`).join('')}</div>`:'';$('#hero').innerHTML=`<div class="heroInner"><div class="heroText"><div class="heroEyebrow">🔥 BUGUNGI TAKLIF</div><h2>${esc(b.title||'BBQ Burger')}</h2><p>${esc(b.subtitle||'Issiq va mazali taomlar')}</p></div><div class="heroMedia">${media}</div></div>${dots}`;if(heroTimer)clearInterval(heroTimer);if(arr.length>1)heroTimer=setInterval(()=>{heroIndex=(heroIndex+1)%arr.length;renderHero()},5200)}
function renderCats(){$('#cats').innerHTML=`<button class="cat active" data-id="all">🔥 Hammasi</button>`+D.categories.map(c=>`<button class="cat" data-id="${c.id}">${esc(c.emoji||'🍽️')} ${esc(c.name)}</button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.id;renderProducts()})}
function filtered(){const q=$('#search').value.trim().toLowerCase();return D.products.filter(p=>(activeCat==='all'||p.category_id===activeCat)&&(!q||p.name.toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q)))}
function badgeText(p){const b=String(p.badge||'').trim();if(!b)return'';const l=b.toLowerCase();if(l.includes('top')||l.includes('ko‘p')||l.includes("ko'p"))return'🔥 '+b;if(l.includes('yangi'))return'✨ '+b;return b}
function renderProducts(){const arr=filtered();$('#productCount').textContent=arr.length+' ta mahsulot';$('#products').innerHTML=arr.map(p=>{const q=cart[p.id]||0;return `<article class="product" onclick="openProduct('${p.id}')"><div class="pic">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" onerror="this.style.display='none'">`:'🍔'}${p.badge?`<div class="badge">${esc(badgeText(p))}</div>`:''}${!p.is_in_stock?'<div class="sold">Hozir mavjud emas</div>':''}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||'Mazali va yangi tayyorlangan')}</div><div class="foot"><div class="price">${money(p.price_uzs)}</div>${p.is_in_stock?(q?`<div class="qty" onclick="event.stopPropagation()"><button onclick="chg('${p.id}',-1,event)">−</button><b>${q}</b><button onclick="chg('${p.id}',1,event)">+</button></div>`:`<button class="add" onclick="event.stopPropagation();chg('${p.id}',1,event)">+</button>`):''}</div></div></article>`}).join('')||'<div style="grid-column:1/3;text-align:center;padding:30px;color:#777">Mahsulot topilmadi</div>';updateBar()}
$('#search').oninput=renderProducts;
function flyToCart(id,ev){if(!ev?.currentTarget)return;const p=D.products.find(x=>x.id===id),from=ev.currentTarget.getBoundingClientRect(),to=$('#cartbar').getBoundingClientRect();const el=document.createElement(p?.image_url?'img':'div');el.className='fly';if(p?.image_url)el.src=p.image_url;else{el.textContent='🍔';el.style.display='flex';el.style.alignItems='center';el.style.justifyContent='center';el.style.fontSize='27px'}el.style.left=from.left+'px';el.style.top=from.top+'px';document.body.appendChild(el);requestAnimationFrame(()=>{el.style.left=(to.left+to.width*.68)+'px';el.style.top=(to.top+4)+'px';el.style.transform='scale(.45) rotate(18deg)';el.style.opacity='.2'});setTimeout(()=>el.remove(),600)}
function chg(id,d,ev){const before=cart[id]||0;cart[id]=Math.max(0,before+d);if(!cart[id])delete cart[id];localStorage.setItem('bbq_cart',JSON.stringify(cart));if(d>0){flyToCart(id,ev);tg?.HapticFeedback?.impactOccurred('light')}renderProducts();const bar=$('#cartbar');bar.classList.remove('cartPulse');void bar.offsetWidth;bar.classList.add('cartPulse')}
function loadCart(){try{cart=JSON.parse(localStorage.getItem('bbq_cart')||'{}')||{}}catch{cart={}}renderProducts()}
function cartRows(){return Object.entries(cart).map(([id,q])=>({p:D.products.find(x=>x.id===id),q})).filter(x=>x.p)}
function totals(){const subtotal=cartRows().reduce((s,x)=>s+x.p.price_uzs*x.q,0),fee=Number(D.settings.delivery_fee_uzs||0);return{subtotal,fee,total:subtotal+fee}}
function updateBar(){const rows=cartRows(),n=rows.reduce((s,x)=>s+x.q,0),t=rows.reduce((s,x)=>s+x.p.price_uzs*x.q,0);$('#cartbar').style.display=n?'flex':'none';$('#cartCount').textContent=n+' ta';$('#cartTotal').textContent=money(t)}
function openProduct(id){const p=D.products.find(x=>x.id===id);if(!p)return;const q=cart[id]||0;const media=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'<div class="detailEmoji">🍔</div>';const control=!p.is_in_stock?'<button class="secondary" disabled>Hozir mavjud emas</button>':q?`<div class="qty"><button onclick="chg('${id}',-1,event);openProduct('${id}')">−</button><b>${q}</b><button onclick="chg('${id}',1,event);openProduct('${id}')">+</button></div>`:`<button class="detailAdd" onclick="chg('${id}',1,event);openProduct('${id}')">Savatga qo‘shish</button>`;$('#sheetContent').innerHTML=`<div class="detailMedia">${media}${p.badge?`<div class="detailBadge">${esc(badgeText(p))}</div>`:''}</div><div class="detailName">${esc(p.name)}</div><div class="detailDesc">${esc(p.description||'Mazali, yangi tayyorlangan va issiq holda yetkaziladi.')}</div><div class="detailFoot"><div class="detailPrice">${money(p.price_uzs)}</div>${control}</div><button class="secondary" onclick="closeSheet()">Yopish</button>`;$('#sheet').style.display='flex'}
function openCart(){const rows=cartRows(),t=totals();$('#sheetContent').innerHTML=`<h2>Savat</h2>${rows.map(x=>`<div class="cartitem"><div><b>${esc(x.p.name)}</b><br><span class="hello">${money(x.p.price_uzs)} × ${x.q}</span></div><div class="qty"><button onclick="chg('${x.p.id}',-1,event);openCart()">−</button><b>${x.q}</b><button onclick="chg('${x.p.id}',1,event);openCart()">+</button></div></div>`).join('')}<div class="sumrow"><span>Mahsulotlar</span><b>${money(t.subtotal)}</b></div><div class="sumrow"><span>Yetkazib berish</span><b>${money(t.fee)}</b></div><div class="sumrow total"><span>Jami</span><span>${money(t.total)}</span></div><button class="primary" onclick="checkout()">Buyurtma berish</button><button class="secondary" onclick="closeSheet()">Davom etish</button>`;$('#sheet').style.display='flex'}
function closeSheet(){$('#sheet').style.display='none'}
function addressList(){return D.profile?.addresses||[]}
function checkout(){const p=D.profile||{},arr=addressList();if(!checkoutAddressId||!arr.some(a=>a.id===checkoutAddressId))checkoutAddressId=(arr.find(a=>a.is_default)||arr[0])?.id||null;const cards=arr.map(a=>`<button class="addressChoice ${a.id===checkoutAddressId?'selected':''}" data-address-id="${a.id}" onclick="selectCheckoutAddress('${a.id}')"><div class="choiceTop"><b>${esc(a.label)}</b>${a.is_default?'<span class="pill">Standart</span>':''}</div><div class="addrText">${esc(a.address_text||'Lokatsiya saqlangan')}</div>${a.latitude!=null&&a.longitude!=null?'<div class="muted">📍 Lokatsiya mavjud</div>':''}</button>`).join('');$('#sheetContent').innerHTML=`<h2>Yetkazib berish</h2><label>Ismingiz</label><input id="cname" value="${esc(p.name||'')}"><label>Telefon raqam</label><div class="verifyRow"><div><b>${esc(p.phone||'Tasdiqlanmagan')}</b><br><span class="${p.phone_verified?'ok':'bad'}">${p.phone_verified?'✅ Telegram orqali tasdiqlangan':'❌ Tasdiqlanmagan'}</span></div></div>${p.phone_verified?'':`<button class="verify" onclick="verifyPhone(true)">📱 Telegram orqali tasdiqlash</button>`}<div class="sectionHead" style="margin-top:14px"><b>Yetkazish manzili</b><button onclick="editAddress('', 'checkout')">+ Yangi</button></div>${cards||'<div class="info">Hali saqlangan manzil yo‘q. Avval manzil qo‘shing.</div>'}<label>Izoh</label><textarea id="comment" placeholder="Masalan: domofon ishlamaydi"></textarea>${arr.length?'<button class="primary" id="sendOrder" onclick="sendOrder()">Buyurtmani tasdiqlash</button>':''}<button class="secondary" onclick="openCart()">Orqaga</button>`;$('#sheet').style.display='flex'}
function selectCheckoutAddress(id){checkoutAddressId=id;document.querySelectorAll('.addressChoice').forEach(x=>x.classList.toggle('selected',x.dataset.addressId===id));tg?.HapticFeedback?.selectionChanged()}
async function sendOrder(){const btn=$('#sendOrder'),name=$('#cname').value.trim();if(!D.profile?.phone_verified){alert('Avval telefon raqamingizni Telegram orqali tasdiqlang');return}if(!name){alert('Ismingizni kiriting');return}if(!checkoutAddressId){alert('Yetkazish manzilini tanlang');return}btn.disabled=true;btn.textContent='Yuborilmoqda...';const save=await call('update_profile',{name});if(!save.ok){alert('Profilni saqlashda xato: '+save.error);btn.disabled=false;btn.textContent='Buyurtmani tasdiqlash';return}D.profile=save.profile;const r=await call('create_order',{items:cartRows().map(x=>({product_id:x.p.id,quantity:x.q})),customer_name:name,address_id:checkoutAddressId,comment:$('#comment').value.trim()});if(!r.ok){alert(r.error==='phone_not_verified'?'Telefon raqami tasdiqlanmagan':r.error);btn.disabled=false;btn.textContent='Buyurtmani tasdiqlash';return}cart={};localStorage.removeItem('bbq_cart');renderProducts();syncHeader();$('#sheetContent').innerHTML=`<div class="success"><div class="big">✅</div><h2>Buyurtma qabul qilindi</h2><p>Buyurtma raqami: <b>#${r.order.order_number}</b></p><p>Jami: <b>${money(r.order.total_uzs)}</b></p><button class="primary" onclick="closeSheet();showView('orders')">Buyurtmani ko‘rish</button></div>`}
async function loadOrders(){const r=await call('my_orders');if(!r.ok){$('#orders').innerHTML='<div class="profileCard">Xatolik: '+esc(r.error)+'</div>';return}$('#orders').innerHTML=(r.orders||[]).map(o=>`<div class="order"><div class="orderTop"><div><div class="orderNum">Buyurtma #${o.order_number}</div><div class="muted">${new Date(o.created_at).toLocaleString()}</div></div><span class="pill">${statusNames[o.status]||o.status}</span></div><div style="margin-top:9px"><b>${money(o.total_uzs)}</b><br><span class="muted">${esc(o.address_text||'Lokatsiya')}</span></div></div>`).join('')||'<div class="profileCard">Hozircha buyurtmalar yo‘q.</div>'}
function renderProfile(){const p=D.profile||{},arr=addressList();const cards=arr.map(a=>`<div class="addrCard ${a.is_default?'default':''}"><div class="addrHead"><div><div class="addrTitle">${esc(a.label)}</div><div class="addrText">${esc(a.address_text||'Lokatsiya saqlangan')}</div>${a.latitude!=null&&a.longitude!=null?'<div class="muted">📍 Lokatsiya mavjud</div>':''}</div>${a.is_default?'<span class="pill">Standart</span>':''}</div><div class="addrActions"><button class="miniPrimary" onclick="editAddress('${a.id}','profile')">✏️ Tahrirlash</button>${a.is_default?'':`<button class="miniDefault" onclick="setDefaultAddressUI('${a.id}')">⭐ Standart</button>`}<button class="miniDanger" onclick="deleteAddressUI('${a.id}')">🗑 O‘chirish</button></div></div>`).join('');$('#profileContent').innerHTML=`<div class="profileCard"><label>Ism</label><input id="pname" value="${esc(p.name||'')}"><button class="primary" onclick="saveProfileUI()">Ismni saqlash</button><label>Telefon</label><div class="verifyRow"><div><b>${esc(p.phone||'Raqam hali olinmagan')}</b><br><span class="${p.phone_verified?'ok':'bad'}">${p.phone_verified?'✅ Tasdiqlangan':'❌ Tasdiqlanmagan'}</span></div></div><button class="verify" id="verifyBtn" onclick="verifyPhone(false)">${p.phone_verified?'📱 Telefon raqamini o‘zgartirish':'📱 Telegram orqali telefonni tasdiqlash'}</button></div><div class="profileCard"><div class="sectionHead"><div><b>Saqlangan manzillar</b><div class="muted">Uy, Ish yoki boshqa manzil</div></div><button onclick="editAddress('','profile')">+ Qo‘shish</button></div>${cards||'<div class="info">Hali manzil saqlanmagan.</div>'}</div><div class="info">Standart manzil buyurtma vaqtida avtomatik tanlanadi. Istalgan payt manzilni tahrirlash yoki boshqasini standart qilish mumkin.</div>`}
async function saveProfileUI(){const name=$('#pname').value.trim();if(!name){alert('Ismni kiriting');return}const r=await call('update_profile',{name});if(!r.ok){alert(r.error);return}D.profile=r.profile;syncHeader();renderProfile();tg?.HapticFeedback?.notificationOccurred('success');alert('Ism saqlandi')}
async function refreshProfile(){const r=await call('profile');if(r.ok){D.profile=r.profile;syncHeader();renderProfile();return r.profile}return null}
function editAddress(id='',returnTo='profile'){addressReturn=returnTo;const a=id?addressList().find(x=>x.id===id):null;addressCoords=(a?.latitude!=null&&a?.longitude!=null)?{latitude:a.latitude,longitude:a.longitude}:null;const label=a?.label||'Uy';$('#sheetContent').innerHTML=`<h2>${a?'Manzilni tahrirlash':'Yangi manzil'}</h2><label>Nomi</label><select id="addrLabel"><option ${label==='Uy'?'selected':''}>Uy</option><option ${label==='Ish'?'selected':''}>Ish</option><option ${label==='Boshqa'?'selected':''}>Boshqa</option></select><label>Manzil</label><input id="addrText" placeholder="Mahalla, ko‘cha, uy" value="${esc(a?.address_text||'')}"><button class="secondary" onclick="getAddressLocation()">📍 Lokatsiyani tanlash / yangilash</button><div class="locstate" id="addrLoc">${addressCoords?'✅ Lokatsiya saqlangan':'Lokatsiya tanlanmagan'}</div><div class="checkrow"><input id="addrDefault" type="checkbox" ${a?.is_default||!addressList().length||returnTo==='checkout'?'checked':''}><label for="addrDefault">Standart manzil qilish</label></div><button class="primary" onclick="saveAddressUI('${id}')">Saqlash</button><button class="secondary" onclick="${returnTo==='checkout'?'checkout()':'closeSheet()'}">Bekor qilish</button>`;$('#sheet').style.display='flex'}
function geo(setter,textId){if(!navigator.geolocation){$(textId).textContent='Bu qurilmada lokatsiya mavjud emas';return}$(textId).textContent='Joylashuv olinmoqda...';navigator.geolocation.getCurrentPosition(p=>{setter({latitude:p.coords.latitude,longitude:p.coords.longitude});$(textId).textContent='✅ Joylashuv olindi'},()=>{$(textId).textContent='Lokatsiya berilmadi. Manzilni qo‘lda yozing.'},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
function getAddressLocation(){geo(v=>addressCoords=v,'#addrLoc')}
async function saveAddressUI(id){const label=$('#addrLabel').value,address=$('#addrText').value.trim(),isDefault=$('#addrDefault').checked;if(!address&&!addressCoords){alert('Manzil yozing yoki lokatsiyani tanlang');return}const r=await call('save_address',{id:id||undefined,label,address_text:address,latitude:addressCoords?.latitude??null,longitude:addressCoords?.longitude??null,is_default:isDefault});if(!r.ok){alert(r.error);return}D.profile=r.profile;const saved=id?D.profile.addresses.find(a=>a.id===id):D.profile.addresses.find(a=>a.label===label&&String(a.address_text||'')===address)||D.profile.address;if(addressReturn==='checkout'){checkoutAddressId=saved?.id||D.profile.address?.id||null;checkout()}else{closeSheet();renderProfile()}tg?.HapticFeedback?.notificationOccurred('success')}
async function setDefaultAddressUI(id){const r=await call('set_default_address',{id});if(!r.ok){alert(r.error);return}D.profile=r.profile;renderProfile();tg?.HapticFeedback?.notificationOccurred('success')}
async function deleteAddressUI(id){if(!confirm('Manzil o‘chirilsinmi?'))return;const r=await call('delete_address',{id});if(!r.ok){alert(r.error);return}D.profile=r.profile;if(checkoutAddressId===id)checkoutAddressId=D.profile.address?.id||null;renderProfile();tg?.HapticFeedback?.notificationOccurred('success')}
async function verifyPhone(fromCheckout=false){if(!tg?.requestContact){tg?.showAlert?.('Bu Telegram versiyasida avtomatik telefon so‘rash mavjud emas. Bot chatiga /phone yuboring.');tg?.openTelegramLink?.('https://t.me/bbq_burgerbot');return}const btn=$('#verifyBtn');if(btn){btn.disabled=true;btn.textContent='Telegram tasdiqlashi kutilmoqda...'}tg.requestContact(async ok=>{if(!ok){if(btn){btn.disabled=false;btn.textContent='📱 Telegram orqali telefonni tasdiqlash'}return}for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,500));const p=await refreshProfile();if(p?.phone_verified){tg?.HapticFeedback?.notificationOccurred('success');if(fromCheckout)checkout();return}}alert('Kontakt yuborildi, lekin tasdiqlash hali kelmadi. Bir necha soniyadan keyin qayta oching.')})}
function showView(v){['menu','orders','profile'].forEach(x=>$('#'+x+'View').classList.toggle('hide',x!==v));document.querySelectorAll('.tabsBottom button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#cartbar').style.display=v==='menu'&&cartRows().length?'flex':'none';if(v==='orders')loadOrders();if(v==='profile')refreshProfile()}
document.querySelectorAll('.tabsBottom button').forEach(b=>b.onclick=()=>showView(b.dataset.view));$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});start();
</script>
</body>
</html>
