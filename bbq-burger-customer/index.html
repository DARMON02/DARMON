<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>BBQ Burger</title>
<style>
:root{--orange:#ff6a00;--dark:#151515;--bg:#f4f4f4;--muted:#777;--green:#17823c;--red:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#1a1a1a}.app{max-width:520px;margin:auto;padding:12px 12px 105px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{font-size:22px;font-weight:900}.brand b{color:var(--orange)}.hello,.muted{font-size:12px;color:var(--muted)}.statusbox{background:#fff3cd;padding:11px 12px;border-radius:14px;margin-bottom:10px}.hero{background:linear-gradient(135deg,#171717,#303030);color:#fff;border-radius:22px;padding:18px;min-height:138px;position:relative;overflow:hidden;margin-bottom:12px}.hero:after{content:'🍔';position:absolute;font-size:90px;right:2px;bottom:-18px;transform:rotate(-8deg)}.hero h2{margin:0 0 6px;font-size:23px;max-width:75%}.hero p{margin:0;max-width:70%;font-size:13px;color:#ddd;line-height:1.35}.search{display:flex;gap:8px;background:#fff;border-radius:16px;padding:11px 13px;margin-bottom:12px}.search input{border:0;outline:0;width:100%;font-size:15px;background:transparent}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.cat{border:0;background:#fff;border-radius:999px;padding:10px 14px;font-weight:700;white-space:nowrap}.cat.active{background:var(--orange);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 14px #0000000a;display:flex;flex-direction:column}.pic{height:125px;background:linear-gradient(145deg,#f3e3d4,#ffe8c7);display:flex;align-items:center;justify-content:center;font-size:58px;position:relative;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.sold{position:absolute;inset:0;background:#0008;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.body{padding:11px;display:flex;flex:1;flex-direction:column}.name{font-weight:800;font-size:14px;line-height:1.25}.desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3;min-height:29px}.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:9px}.price{font-weight:900;font-size:14px}.add{border:0;background:var(--orange);color:#fff;width:34px;height:34px;border-radius:11px;font-size:20px;font-weight:800}.qty{display:flex;align-items:center;gap:6px}.qty button{border:0;width:28px;height:28px;border-radius:9px;background:#eee;font-weight:900}.qty b{min-width:15px;text-align:center}.cartbar{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),496px);background:var(--dark);color:#fff;border-radius:17px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;z-index:15;box-shadow:0 10px 30px #0004}.cartbar button{border:0;background:var(--orange);color:#fff;border-radius:12px;padding:10px 15px;font-weight:800}.sheetbg{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end}.sheet{background:#f7f7f7;width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px}.grab{width:45px;height:5px;border-radius:9px;background:#ccc;margin:0 auto 12px}.cartitem{background:#fff;border-radius:15px;padding:12px;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.sumrow{display:flex;justify-content:space-between;padding:6px 2px;font-size:13px}.total{font-size:18px;font-weight:900}.primary,.secondary,.verify{border:0;border-radius:14px;padding:13px 15px;font-weight:800;width:100%;margin-top:9px}.primary{background:var(--orange);color:#fff}.secondary{background:#eaeaea}.verify{background:#e9f3ff;color:#145da0}label{display:block;font-size:12px;font-weight:800;margin:10px 0 4px}input,textarea{width:100%;border:1px solid #ddd;border-radius:13px;padding:12px;font-size:14px;background:#fff}.success{text-align:center;padding:25px 10px}.success .big{font-size:55px}.orders .order{background:#fff;border-radius:16px;padding:13px;margin-bottom:9px}.orderTop{display:flex;justify-content:space-between;gap:10px}.orderNum{font-weight:900}.pill{background:#eee;border-radius:999px;padding:5px 8px;font-size:11px}.tabsBottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:72px;background:#fff;border-top:1px solid #eee;display:flex;z-index:20}.tabsBottom button{flex:1;border:0;background:#fff;font-size:11px;font-weight:700}.tabsBottom button.active{color:var(--orange)}.tabsBottom span{display:block;font-size:21px;margin-bottom:3px}.hide{display:none!important}.profileCard{background:#fff;border-radius:18px;padding:16px;margin-bottom:10px}.verifyRow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f7f7f7;border-radius:13px;padding:11px}.ok{color:var(--green);font-weight:800}.bad{color:var(--red);font-weight:800}.locstate{font-size:12px;color:var(--muted);margin-top:6px}.info{background:#eef6ff;padding:11px;border-radius:13px;font-size:12px;line-height:1.4;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <div class="head"><div><div class="brand">🔥 <b>BBQ</b> BURGER</div><div class="hello" id="hello">Yuklanmoqda...</div></div><div id="shopState"></div></div>
  <div class="statusbox" id="status">Telegram tekshirilmoqda...</div>
  <section id="menuView">
    <div class="hero" id="hero"><h2>Issiq burger. Tez yetkazib berish.</h2><p>Sevimli taomingizni bir necha bosishda buyurtma qiling.</p></div>
    <div class="search">🔎 <input id="search" placeholder="Mahsulot qidirish"></div>
    <div class="cats" id="cats"></div><div class="grid" id="products"></div>
  </section>
  <section id="ordersView" class="hide"><h2>Buyurtmalarim</h2><div class="orders" id="orders"></div></section>
  <section id="profileView" class="hide"><h2>Profil</h2><div id="profileContent"></div></section>
</div>
<div class="cartbar" id="cartbar"><div><b id="cartCount">0 ta</b><br><span id="cartTotal">0 so‘m</span></div><button onclick="openCart()">Savatni ochish</button></div>
<div class="sheetbg" id="sheet"><div class="sheet"><div class="grab"></div><div id="sheetContent"></div></div></div>
<div class="tabsBottom"><button class="active" data-view="menu"><span>🍔</span>Menyu</button><button data-view="orders"><span>🧾</span>Buyurtmalar</button><button data-view="profile"><span>👤</span>Profil</button></div>
<script>
const API='https://tgcmevhuxwzcmeseysax.supabase.co/functions/v1/bbq-customer-api';
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const initData=tg?.initData||'';
let D={categories:[],products:[],banners:[],settings:{},user:null,profile:null},cart={},activeCat='all',profileCoords=null,checkoutCoords=null;
const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('ru-RU')+' so‘m',esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const statusNames={new:'🆕 Yangi',accepted:'✅ Qabul qilindi',preparing:'👨‍🍳 Tayyorlanmoqda',courier:'🛵 Kuryerda',delivered:'✅ Yetkazildi',cancelled:'❌ Bekor qilindi'};
async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,initData,...extra})});return r.json()}
async function start(){if(!initData){$('#status').textContent='Bu Mini App faqat Telegram bot ichidan ochiladi.';return}const r=await call('bootstrap');if(!r.ok){$('#status').textContent='Kirish xatosi: '+r.error;return}D=r;$('#status').classList.add('hide');$('#hello').textContent='Salom, '+(r.profile?.name||r.user?.first_name||'mijoz')+'!';$('#shopState').innerHTML=r.settings.shop_open===false?'<span class="pill">Yopiq</span>':'<span class="pill" style="background:#e5f8eb;color:#16743b">Ochiq</span>';renderHero();renderCats();loadCart();renderProfile()}
function renderHero(){const b=D.banners?.[0];if(b)$('#hero').innerHTML=`<h2>${esc(b.title)}</h2><p>${esc(b.subtitle||'')}</p>`}
function renderCats(){$('#cats').innerHTML=`<button class="cat active" data-id="all">Hammasi</button>`+D.categories.map(c=>`<button class="cat" data-id="${c.id}">${esc(c.emoji||'')} ${esc(c.name)}</button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.id;renderProducts()})}
function filtered(){const q=$('#search').value.trim().toLowerCase();return D.products.filter(p=>(activeCat==='all'||p.category_id===activeCat)&&(!q||p.name.toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q)))}
function renderProducts(){const arr=filtered();$('#products').innerHTML=arr.map(p=>{const q=cart[p.id]||0;return `<div class="product"><div class="pic">${p.image_url?`<img src="${esc(p.image_url)}" onerror="this.remove()">`:'🍔'}${p.badge?`<div class="badge">${esc(p.badge)}</div>`:''}${!p.is_in_stock?'<div class="sold">Tugagan</div>':''}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||'')}</div><div class="foot"><div class="price">${money(p.price_uzs)}</div>${p.is_in_stock?(q?`<div class="qty"><button onclick="chg('${p.id}',-1)">−</button><b>${q}</b><button onclick="chg('${p.id}',1)">+</button></div>`:`<button class="add" onclick="chg('${p.id}',1)">+</button>`):''}</div></div></div>`}).join('')||'<div style="grid-column:1/3;text-align:center;padding:30px;color:#777">Mahsulot topilmadi</div>';updateBar()}
$('#search').oninput=renderProducts;
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];localStorage.setItem('bbq_cart',JSON.stringify(cart));renderProducts()}
function loadCart(){try{cart=JSON.parse(localStorage.getItem('bbq_cart')||'{}')||{}}catch{cart={}}renderProducts()}
function cartRows(){return Object.entries(cart).map(([id,q])=>({p:D.products.find(x=>x.id===id),q})).filter(x=>x.p)}
function totals(){const subtotal=cartRows().reduce((s,x)=>s+x.p.price_uzs*x.q,0),fee=Number(D.settings.delivery_fee_uzs||0);return{subtotal,fee,total:subtotal+fee}}
function updateBar(){const rows=cartRows(),n=rows.reduce((s,x)=>s+x.q,0),t=rows.reduce((s,x)=>s+x.p.price_uzs*x.q,0);$('#cartbar').style.display=n?'flex':'none';$('#cartCount').textContent=n+' ta';$('#cartTotal').textContent=money(t)}
function openCart(){const rows=cartRows(),t=totals();$('#sheetContent').innerHTML=`<h2>Savat</h2>${rows.map(x=>`<div class="cartitem"><div><b>${esc(x.p.name)}</b><br><span class="hello">${money(x.p.price_uzs)} × ${x.q}</span></div><div class="qty"><button onclick="chg('${x.p.id}',-1);openCart()">−</button><b>${x.q}</b><button onclick="chg('${x.p.id}',1);openCart()">+</button></div></div>`).join('')}<div class="sumrow"><span>Mahsulotlar</span><b>${money(t.subtotal)}</b></div><div class="sumrow"><span>Yetkazib berish</span><b>${money(t.fee)}</b></div><div class="sumrow total"><span>Jami</span><span>${money(t.total)}</span></div><button class="primary" onclick="checkout()">Buyurtma berish</button><button class="secondary" onclick="closeSheet()">Davom etish</button>`;$('#sheet').style.display='flex'}
function closeSheet(){$('#sheet').style.display='none'}
function checkout(){const p=D.profile||{},a=p.address||{};checkoutCoords=(a.latitude!=null&&a.longitude!=null)?{latitude:a.latitude,longitude:a.longitude}:null;$('#sheetContent').innerHTML=`<h2>Yetkazib berish</h2><label>Ismingiz</label><input id="cname" value="${esc(p.name||'')}"><label>Telefon raqam</label><div class="verifyRow"><div><b>${esc(p.phone||'Tasdiqlanmagan')}</b><br><span class="${p.phone_verified?'ok':'bad'}">${p.phone_verified?'✅ Telegram orqali tasdiqlangan':'❌ Tasdiqlanmagan'}</span></div></div>${p.phone_verified?'':`<button class="verify" onclick="verifyPhone(true)">📱 Telegram orqali tasdiqlash</button>`}<label>Manzil</label><input id="address" placeholder="Mahalla, ko‘cha, uy" value="${esc(a.address_text||'')}"><button class="secondary" onclick="getCheckoutLocation()">📍 Joylashuvni yangilash</button><div class="locstate" id="locText">${checkoutCoords?'✅ Saqlangan lokatsiya bor':'Lokatsiya olinmagan'}</div><label>Izoh</label><textarea id="comment" placeholder="Masalan: domofon ishlamaydi"></textarea><button class="primary" id="sendOrder" onclick="sendOrder()">Buyurtmani tasdiqlash</button><button class="secondary" onclick="openCart()">Orqaga</button>`}
function geo(setter,textId){if(!navigator.geolocation){$(textId).textContent='Bu qurilmada lokatsiya mavjud emas';return}$(textId).textContent='Joylashuv olinmoqda...';navigator.geolocation.getCurrentPosition(p=>{setter({latitude:p.coords.latitude,longitude:p.coords.longitude});$(textId).textContent='✅ Joylashuv olindi'},()=>{$(textId).textContent='Lokatsiya berilmadi. Manzilni qo‘lda yozing.'},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
function getCheckoutLocation(){geo(v=>checkoutCoords=v,'#locText')}function getProfileLocation(){geo(v=>profileCoords=v,'#profileLoc')}
async function sendOrder(){const btn=$('#sendOrder'),name=$('#cname').value.trim(),address=$('#address').value.trim();if(!D.profile?.phone_verified){alert('Avval telefon raqamingizni Telegram orqali tasdiqlang');return}if(!name){alert('Ismingizni kiriting');return}if(!address&&!checkoutCoords){alert('Manzil yozing yoki lokatsiyani yuboring');return}btn.disabled=true;btn.textContent='Yuborilmoqda...';const save=await call('update_profile',{name,address_text:address,latitude:checkoutCoords?.latitude??null,longitude:checkoutCoords?.longitude??null});if(!save.ok){alert('Profilni saqlashda xato: '+save.error);btn.disabled=false;btn.textContent='Buyurtmani tasdiqlash';return}D.profile=save.profile;const r=await call('create_order',{items:cartRows().map(x=>({product_id:x.p.id,quantity:x.q})),customer_name:name,address_text:address,latitude:checkoutCoords?.latitude??null,longitude:checkoutCoords?.longitude??null,comment:$('#comment').value.trim()});if(!r.ok){alert(r.error==='phone_not_verified'?'Telefon raqami tasdiqlanmagan':r.error);btn.disabled=false;btn.textContent='Buyurtmani tasdiqlash';return}cart={};localStorage.removeItem('bbq_cart');renderProducts();$('#sheetContent').innerHTML=`<div class="success"><div class="big">✅</div><h2>Buyurtma qabul qilindi</h2><p>Buyurtma raqami: <b>#${r.order.order_number}</b></p><p>Jami: <b>${money(r.order.total_uzs)}</b></p><button class="primary" onclick="closeSheet();showView('orders')">Buyurtmani ko‘rish</button></div>`}
async function loadOrders(){const r=await call('my_orders');if(!r.ok){$('#orders').innerHTML='<div class="profileCard">Xatolik: '+esc(r.error)+'</div>';return}$('#orders').innerHTML=(r.orders||[]).map(o=>`<div class="order"><div class="orderTop"><div><div class="orderNum">Buyurtma #${o.order_number}</div><div class="muted">${new Date(o.created_at).toLocaleString()}</div></div><span class="pill">${statusNames[o.status]||o.status}</span></div><div style="margin-top:9px"><b>${money(o.total_uzs)}</b><br><span class="muted">${esc(o.address_text||'Lokatsiya')}</span></div></div>`).join('')||'<div class="profileCard">Hozircha buyurtmalar yo‘q.</div>'}
function renderProfile(){const p=D.profile||{},a=p.address||{};profileCoords=(a.latitude!=null&&a.longitude!=null)?{latitude:a.latitude,longitude:a.longitude}:null;$('#profileContent').innerHTML=`<div class="profileCard"><label>Ism</label><input id="pname" value="${esc(p.name||'')}"><label>Telefon</label><div class="verifyRow"><div><b>${esc(p.phone||'Raqam hali olinmagan')}</b><br><span class="${p.phone_verified?'ok':'bad'}">${p.phone_verified?'✅ Tasdiqlangan':'❌ Tasdiqlanmagan'}</span></div></div><button class="verify" id="verifyBtn" onclick="verifyPhone(false)">${p.phone_verified?'📱 Telefon raqamini o‘zgartirish':'📱 Telegram orqali telefonni tasdiqlash'}</button><label>Asosiy manzil</label><input id="paddress" placeholder="Mahalla, ko‘cha, uy" value="${esc(a.address_text||'')}"><button class="secondary" onclick="getProfileLocation()">📍 Lokatsiyani tanlash / yangilash</button><div class="locstate" id="profileLoc">${profileCoords?'✅ Saqlangan lokatsiya bor':'Lokatsiya saqlanmagan'}</div><button class="primary" onclick="saveProfileUI()">Saqlash</button><div class="info">Telefon raqami oddiy matn orqali tasdiqlanmaydi. Telegram sizning o‘z kontaktingizni botga yuborgandagina tasdiqlanadi.</div></div>`}
async function saveProfileUI(){const name=$('#pname').value.trim(),address=$('#paddress').value.trim();if(!name){alert('Ismni kiriting');return}const r=await call('update_profile',{name,address_text:address,latitude:profileCoords?.latitude??null,longitude:profileCoords?.longitude??null});if(!r.ok){alert(r.error);return}D.profile=r.profile;$('#hello').textContent='Salom, '+D.profile.name+'!';renderProfile();tg?.HapticFeedback?.notificationOccurred('success');alert('Profil saqlandi')}
async function refreshProfile(){const r=await call('profile');if(r.ok){D.profile=r.profile;renderProfile();return r.profile}return null}
async function verifyPhone(fromCheckout=false){if(!tg?.requestContact){tg?.showAlert?.('Bu Telegram versiyasida avtomatik telefon so‘rash mavjud emas. Bot chatiga /phone yuboring.');tg?.openTelegramLink?.('https://t.me/bbq_burgerbot');return}const btn=$('#verifyBtn');if(btn){btn.disabled=true;btn.textContent='Telegram tasdiqlashi kutilmoqda...'}tg.requestContact(async ok=>{if(!ok){if(btn){btn.disabled=false;btn.textContent='📱 Telegram orqali telefonni tasdiqlash'}return}for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,500));const p=await refreshProfile();if(p?.phone_verified){tg?.HapticFeedback?.notificationOccurred('success');if(fromCheckout)checkout();return}}alert('Kontakt yuborildi, lekin tasdiqlash hali kelmadi. Bir necha soniyadan keyin qayta oching.')})}
function showView(v){['menu','orders','profile'].forEach(x=>$('#'+x+'View').classList.toggle('hide',x!==v));document.querySelectorAll('.tabsBottom button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#cartbar').style.display=v==='menu'&&cartRows().length?'flex':'none';if(v==='orders')loadOrders();if(v==='profile')refreshProfile()}
document.querySelectorAll('.tabsBottom button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
start();
</script>
</body>
</html>
