name: Deploy BBQ Burger Mini Apps to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "bbq-burger-customer/**"
      - "bbq-burger-admin/**"
      - ".github/workflows/bbq-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/admin
          cp -a bbq-burger-customer/. _site/
          cp -a bbq-burger-admin/. _site/admin/
          if ! grep -q 'settings-addon.js' _site/admin/index.html; then
            sed -i 's#</body>#<script src="settings-addon.js"></script></body>#' _site/admin/index.html
          fi
      - name: Upload Mini Apps artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
